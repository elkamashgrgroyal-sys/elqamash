<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="d1315a3e-89a6-28be-bddc-98970fd1f02e.jpeg">
<title>القماش كلاسيك | Al Qamash Classic</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8924a;--gold2:#d9b66a;--cream:#faf6ef;--beige:#f1e8d8;--ink:#4a3a22;--card:#fffdf8}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);line-height:1.7}
h1,h2,h3,.logo-t{font-family:'Cormorant Garamond','Cairo',serif;font-weight:600}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:auto;padding:0 20px}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(250,246,239,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--beige)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;max-width:1200px;margin:auto}
.logo{display:flex;flex-direction:column;align-items:center}
.logo-c{width:64px;height:64px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:30px}
.logo-t{font-size:12px;color:var(--gold)}
nav{display:flex;gap:26px;justify-content:center;padding-bottom:8px;flex-wrap:wrap}
nav a{font-size:17px;padding:2px 4px;border-bottom:2px solid transparent}
nav a:hover{border-color:var(--gold);color:var(--gold)}
.lang{display:flex;border:1px solid var(--gold);border-radius:30px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 14px;font:600 14px Cairo;cursor:pointer;color:var(--ink)}
.lang button.on{background:var(--gold);color:#fff}
/* hero */
.hero{min-height:480px;display:grid;place-items:center;text-align:center;color:#fff;padding:40px 20px;
background:linear-gradient(rgba(50,34,8,.5),rgba(50,34,8,.6)),url('images/palace.jpg') center/cover no-repeat,radial-gradient(circle at 50% 10%,#e8d3a0,#a98343 60%,#6b5026)}
.hero h1{font-size:clamp(30px,5vw,54px);text-shadow:0 2px 10px #0006}
.hero p{font-size:19px;margin:10px 0 24px;text-shadow:0 1px 6px #0007}
.search{display:flex;background:#fff;border-radius:40px;padding:6px;max-width:660px;margin:auto;box-shadow:0 8px 30px #0003}
.search input{flex:1;border:0;outline:0;padding:0 18px;font:16px Cairo;background:none;color:var(--ink)}
.btn{background:var(--gold);color:#fff;border:0;border-radius:30px;padding:10px 26px;font:700 16px Cairo;cursor:pointer;transition:.2s}
.btn:hover{background:#9c7a39}
.btn.wa{background:linear-gradient(#c9a35a,#9c7a39);padding:14px 40px;font-size:20px;box-shadow:0 6px 18px #9c7a3955}
/* sections */
section{padding:56px 0}
.sec-t{text-align:center;margin-bottom:30px}
.sec-t h2{font-size:38px}
.sec-t p{color:#7a6642}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid #e9dcc0;border-radius:18px;padding:14px;text-align:center;box-shadow:0 4px 16px #b8924a14;transition:.25s}
.card:hover{transform:translateY(-5px);box-shadow:0 10px 26px #b8924a30}
.ph{height:170px;border-radius:12px;display:grid;place-items:center;font-size:56px;margin-bottom:10px;background:linear-gradient(135deg,#f5ecd9,#e5d3ab);background-size:cover;background-position:center}
.card h3{font-size:22px}
.card small{display:block;color:#7a6642}
.card .more{display:inline-block;margin-top:8px;color:var(--gold);font-weight:700;cursor:pointer}
.price{display:inline-block;margin:8px 0;padding:2px 14px;border-radius:8px;background:var(--beige);font-size:14px}
.alt{background:var(--beige)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.cats .card{padding:12px 8px}.cats .ph{height:120px;font-size:44px}.cats h3{font-size:20px;line-height:1.2}
.cats .en{color:var(--gold);font:600 14px 'Cormorant Garamond',serif;margin-bottom:2px}
@media(max-width:900px){.cats{grid-template-columns:repeat(5,170px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}.cats .card{scroll-snap-align:start}}
/* before after */
.ba{max-width:560px;margin:auto;position:relative;height:300px;border-radius:18px;overflow:hidden;border:1px solid #e1d0a8;user-select:none}
.ba>div{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:18px;text-align:center}
.ba .b{background:#e9e4dc;color:#7a6a50}
.ba .a{background:linear-gradient(135deg,#f6ecd6,#d7bd84);clip-path:inset(0 50% 0 0);font-size:22px}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:3}
.ba .bar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;z-index:2;box-shadow:0 0 8px #0005}
/* services */
.srv{text-align:center;padding:24px 16px}
.srv .ic{font-size:40px}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gal .ph{height:200px;margin:0;font-size:36px}.gal{align-items:start}
/* reviews */
.rv-top{text-align:center;margin-bottom:20px}
.stars{color:var(--gold);font-size:30px;letter-spacing:4px}
.rform{max-width:560px;margin:0 auto 26px;background:var(--card);border:1px solid #e9dcc0;border-radius:18px;padding:20px;display:grid;gap:10px}
.rform input,.rform textarea{border:1px solid #e0d1ac;border-radius:10px;padding:10px 14px;font:15px Cairo;background:#fff;color:var(--ink)}
.pick{font-size:34px;cursor:pointer;color:#d8c9a4;text-align:center;direction:ltr}
.pick span.on{color:var(--gold)}
.rv{background:var(--card);border:1px solid #e9dcc0;border-radius:14px;padding:14px}
/* hours + footer */
.hrs{max-width:520px;margin:auto;background:var(--card);border-radius:18px;padding:20px;border:1px solid #e9dcc0}
.hrs div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e4d6b4}
footer{background:#3d2f1a;color:#eadfc5;padding:36px 0;text-align:center}
.soc{display:flex;gap:12px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.soc a{background:var(--gold);color:#fff;border-radius:30px;padding:8px 20px;font-weight:600}
.strip{background:var(--beige);text-align:center;padding:12px;font-size:15px}
/* gold whatsapp button */
.crow{display:flex;align-items:center;gap:8px;margin-top:10px}
.gbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 10px;border-radius:40px;color:#fff;font:700 14px Cairo;
background:linear-gradient(180deg,#d4ad62,#a07c3a);box-shadow:0 0 0 3px #f3dfae88,0 6px 18px #d9b66a88;transition:.25s;white-space:nowrap}
.gbtn:hover{transform:translateY(-2px);box-shadow:0 0 0 4px #f3dfaecc,0 10px 24px #d9b66a}
.gbtn svg{width:22px;height:22px;flex:none}
.heart{background:none;border:0;font-size:26px;cursor:pointer;color:var(--gold);line-height:1}
.heart.on{color:#c0392b}
.gi{background:var(--card);border:1px solid #e9dcc0;border-radius:18px;padding:10px;box-shadow:0 4px 16px #b8924a14}
.gi h3{font-size:18px;text-align:center;margin-top:6px}
/* floating */
.fwa{position:fixed;bottom:20px;left:20px;z-index:60;background:#25d366;color:#fff;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;box-shadow:0 6px 18px #0004}
.bot-t{position:fixed;bottom:20px;right:20px;z-index:60;background:var(--gold);color:#fff;border:0;border-radius:30px;padding:14px 22px;font:700 16px Cairo;cursor:pointer;box-shadow:0 6px 18px #0004}
.bot{position:fixed;bottom:84px;right:20px;z-index:60;width:340px;max-width:calc(100vw - 30px);background:#fff;border-radius:18px;box-shadow:0 12px 40px #0004;display:none;flex-direction:column;overflow:hidden;border:1px solid #e1d0a8}
.bot.open{display:flex}
.bot-h{background:var(--gold);color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between}
.bot-h i{width:10px;height:10px;background:#3ddc6c;border-radius:50%;display:inline-block;margin-inline-end:6px}
.msgs{height:280px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--cream)}
.m{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;white-space:pre-line}
.m.b{background:linear-gradient(#c9a35a,#a98343);color:#fff;align-self:flex-start}
.m.u{background:#fff;border:1px solid #e5d8b8;align-self:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:var(--cream)}
.chips button{border:1px solid var(--gold);background:#fff;border-radius:20px;padding:3px 12px;font:13px Cairo;cursor:pointer;color:var(--ink)}
.bin{display:flex;gap:6px;padding:10px;border-top:1px solid #eee}
.bin input{flex:1;border:1px solid #e0d1ac;border-radius:20px;padding:8px 14px;font:14px Cairo;outline:0}
.bin button{background:var(--gold);color:#fff;border:0;border-radius:50%;width:38px;height:38px;cursor:pointer}
.bwa{display:block;text-align:center;background:#25d366;color:#fff;padding:9px;font-weight:700;font-size:14px}
[dir=ltr] .fwa{left:auto;right:20px;bottom:90px}
@media(max-width:700px){nav{gap:14px}nav a{font-size:15px}}

/* ===== design match ===== */
body{background:radial-gradient(circle at 20% 0,#fffdf8,#f7f0e3 70%)}
header{position:relative;background:#fbf8f2;border-bottom:1px solid #eadfc5;box-shadow:0 2px 10px #b8924a14}
.top{max-width:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 56px 0;direction:ltr}
.burger{justify-self:start;background:none;border:0;cursor:pointer;display:grid;gap:5px;padding:6px}
.burger span{display:block;width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,#d9b66a,#a98343)}
.burger span:nth-child(2){width:20px}
.logo-c{width:112px;height:112px;border:1.5px solid var(--gold);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffdf8}
.logo-c .lg{font-size:44px;line-height:1}
.logo-t{font-size:10px;margin-top:2px}
.lang{justify-self:end;background:#f1e8d8;border:0;border-radius:30px;box-shadow:inset 0 0 0 1px #e2d3ae}
.lang button{font-size:16px;padding:7px 18px;border-radius:30px}
.navrow{display:flex;justify-content:center;align-items:center;gap:150px;padding:6px 20px 14px;position:relative}
nav{padding:0;gap:46px}
nav a{font-size:19px;color:#4a3a22}
.icons{display:flex;gap:22px;color:#7a5a22}
.icons a{cursor:pointer;position:relative;display:grid;place-items:center}
.icons svg{width:26px;height:26px}
.cart b{position:absolute;top:-9px;inset-inline-end:-10px;background:var(--gold);color:#fff;border-radius:50%;width:19px;height:19px;font-size:11px;display:grid;place-items:center}
.drawer{position:fixed;inset:0;background:#0005;z-index:90;display:none}
.drawer.open{display:block}
.dp{width:250px;height:100%;background:var(--cream);padding:30px 24px;direction:inherit}
.dp a{display:block;font-size:20px;padding:12px 0;border-bottom:1px solid #eadfc5}
.hero{min-height:480px;padding:70px 20px 40px;background:linear-gradient(rgba(40,25,5,.12),rgba(40,25,5,.3)),url('images/palace.jpg') center/cover no-repeat,radial-gradient(circle at 50% 10%,#e8d3a0,#a98343 60%,#6b5026)}
.hero h1{font-size:clamp(28px,4.4vw,56px);text-shadow:0 2px 14px #000a}
.hero p{font-weight:600;text-shadow:0 1px 8px #000b}
.search{align-items:center;padding:7px 8px 7px 22px}
.search .si{color:var(--gold);display:grid}.search svg{width:26px;height:26px}
.search input{padding:0 14px}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cats{max-width:1200px;margin:auto;gap:28px}
.citem .card{padding:20px 20px 16px;border-radius:20px}
.citem .ph{height:150px;border-radius:10px}
.citem h3{font-size:24px;color:#6b5026}
.citem .en{color:var(--gold)}
.citem .more{display:block;text-align:center;margin-top:12px;color:#8a6a2c;font-weight:600;cursor:pointer}
.strip{border-top:1px solid #eadfc5;padding:14px}
@media(max-width:900px){.top{padding:10px 16px 0}.navrow{gap:14px;flex-wrap:wrap}nav{gap:16px;justify-content:center}nav a{font-size:15px}.logo-c{width:84px;height:84px}.logo-c .lg{font-size:30px}}

/* ===== v3: pages, cards, bot, reviews ===== */
.login{background:linear-gradient(#cfa95c,#a07c3a);color:#fff;border-radius:30px;padding:8px 20px;font-weight:700;font-size:15px;white-space:nowrap}
.rt{justify-self:end;display:flex;gap:10px;align-items:center}
.pgrid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pc{background:#fffdf8;border:1px solid #d9c18a;border-radius:24px;padding:16px;box-shadow:0 6px 20px #b8924a1f;text-align:center}
.pimgs{display:flex;gap:10px;direction:ltr}
.pi{flex:1;height:200px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(135deg,#f1ebe0,#ddd2bd)}
.pi img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.bd{position:absolute;top:8px;left:8px;background:linear-gradient(#d9b66a,#b8924a);color:#fff;font:700 11px Cairo;padding:3px 10px;border-radius:12px;z-index:1}
.dv{width:2px;background:linear-gradient(transparent,var(--gold),transparent);position:relative}
.dv:after{content:'';position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px #fff}
.pc h3{font-size:22px;margin-top:10px;color:#6b5026}
.ar2{font-size:17px;color:#7a6642}
.catpage{padding:34px 0 60px}
.orn{display:flex;align-items:center;gap:18px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}
.orn h2{font-size:clamp(26px,4.5vw,52px);color:#7a5a22;text-align:center}
.sub{text-align:center;color:#7a6642;margin:6px 0 26px;font:20px 'Cormorant Garamond','Cairo',serif}
.statbar{display:flex;justify-content:center;gap:90px;background:var(--beige);padding:14px;border-top:1px solid #e1d0a8;border-bottom:1px solid #e1d0a8;text-align:center;flex-wrap:wrap}
.statbar b{display:block;font-size:22px;color:#6b5026}
.statbar .vis{display:none}
.rbox{max-width:920px;margin:auto;background:#fffdf8;border:1px solid #d9c18a;border-radius:24px;padding:28px;text-align:center}
.bigst{font-size:64px;color:var(--gold);letter-spacing:8px;line-height:1}
.rate{display:block;margin:16px auto;min-width:300px;border-radius:16px;padding:12px 30px;font-size:24px;line-height:1.3}
.rate small{display:block;font-size:16px;font-weight:600}
.wr{display:flex;align-items:center;gap:14px;margin:22px 0 14px;color:#7a5a22;font:600 24px 'Cormorant Garamond','Cairo',serif}
.wr:before,.wr:after{content:'';flex:1;height:1px;background:#d9c18a}
.rform3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;text-align:start}
.rform3 label{font-weight:600;display:block;margin-bottom:4px}
.rform3 input,.rform3 textarea{width:100%;border:1px solid #c9a35a;border-radius:10px;padding:10px 14px;font:15px Cairo;background:#fffdf8;color:var(--ink)}
.pick span{color:var(--gold)}
.dp{width:320px;max-width:88vw;height:auto;margin:20px;border-radius:22px;padding:22px;border:1px solid #d9c18a;box-shadow:0 12px 40px #0004;position:relative}
.dp .x{position:absolute;top:14px;inset-inline-end:18px;font-size:20px;cursor:pointer}
.dp .dl{display:flex;justify-content:center;margin-bottom:10px}
.dp a{display:flex;gap:14px;align-items:center;font-size:18px;padding:9px 4px;border:0;cursor:pointer}
.dp a.g{color:#8a6a2c}
.dp hr{border:0;height:1px;background:#e4d6b4;margin:12px 20px}
.dp .btn{justify-content:center;border-radius:30px;padding:10px;font-size:15px;color:#fff}
.bot{width:360px}
.bot-h{align-items:center;gap:10px;justify-content:flex-start}
.bot-h .lg{width:42px;height:42px;border-radius:50%;background:#fffdf8;display:grid;place-items:center;font-size:22px}
.bot-h small{display:block;font-weight:400;color:#dfffdf}
.msgs{direction:ltr;height:320px}
.m{unicode-bidi:plaintext}
.m.b{background:#fff;color:var(--ink);border:1px solid #d9c18a;align-self:flex-start;border-radius:16px}
.m.u{background:linear-gradient(#d9b66a,#b8924a);color:#fff;border:0;align-self:flex-end}
.m.h{white-space:normal;max-width:92%}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qa button,.qa a{border:1px solid var(--gold);background:#f8efdb;border-radius:20px;padding:5px 12px;font:600 13px Cairo;cursor:pointer;color:var(--ink)}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.th div{height:70px;border-radius:10px;background:linear-gradient(135deg,#f1ebe0,#ddd2bd) center/cover}
.m .gbtn{margin-top:8px;font-size:12px;padding:9px 6px}
@media(max-width:700px){.login{padding:6px 10px;font-size:12px}.lang button{padding:5px 10px;font-size:13px}.top{padding:10px 10px 0}.statbar{gap:30px}}
/* v4 */
.logo-img{width:112px;height:112px;border-radius:50%;display:block;background:#fffdf8}
.bigst{font-size:clamp(24px,7vw,38px);letter-spacing:3px}
.flogin{display:inline-block;background:linear-gradient(#cfa95c,#a07c3a);color:#fff;border-radius:30px;padding:9px 26px;font-weight:700}
.bot-t{display:none}
.bot{bottom:20px}
@media(max-width:900px){.logo-img{width:88px;height:88px}}
/* v5 categories carousel */
.cats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.citem{display:flex;flex-direction:column}.citem .card{flex:1}
.dots{display:none;justify-content:center;gap:8px;margin-top:14px}
.dots i{width:9px;height:9px;border-radius:50%;background:#d9c9a3;cursor:pointer;transition:.2s}
.dots i.on{background:var(--gold);width:22px;border-radius:6px}
@media(max-width:900px){.cats{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:46%;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px}.citem{scroll-snap-align:start}.dots{display:flex}}
</style>
</head>
<body>

<header>
  <div class="top">
    <button class="burger" onclick="toggleDrawer()" aria-label="menu"><span></span><span></span><span></span></button>
    <div class="logo"><img src="images/logo.webp" alt="Al Qamash Classic" class="logo-img"></div>
    <div class="rt"><div class="lang"><button id="bAr" class="on" onclick="setLang('ar')">AR</button><button id="bEn" onclick="setLang('en')">EN</button></div></div>
  </div>
  <div class="navrow">
    <nav id="nav">
      <a href="#home" data-ar="الرئيسية" data-en="Home"></a>
      <a href="#products" data-ar="المنتجات" data-en="Products"></a>
      <a href="#categories" data-ar="الكتالوج" data-en="Catalog"></a>
      <a href="#about" data-ar="من نحن" data-en="About Us"></a>
      <a href="#gallery" data-ar="أعمالنا" data-en="Projects"></a>
      <a href="#contact" data-ar="اتصل بنا" data-en="Contact"></a>
    </nav>
    <div class="icons">
      <a onclick="$('q').scrollIntoView({block:'center'});$('q').focus()" aria-label="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></a>
      <a href="#reviews" aria-label="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a>
      <a onclick="cartGo()" class="cart" aria-label="favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 3h3l2.5 12h11L21 6H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><b id="cartN">0</b></a>
    </div>
  </div>
</header>
<div class="drawer" id="drawer" onclick="toggleDrawer()"></div>

<div id="homeView">
<div class="hero" id="home">

 const m=(lang==='ar'?'عايز أطلب تصميم زي ده: ':'I want a design like this: ')+t;
 const med=g.type==='video'?`<video class="ph" src="${u}" controls preload="metadata" playsinline style="object-fit:cover;width:100%;margin:0"></video>`
 :`<div class="ph" ${ph(u)} style="margin:0;${u?`background-image:url('${u}')`:''}">${u?'':'🏛️'}</div>`;
 return `<div class="gi">${med}${t?`<h3>${t.replace(/</g,'&lt;')}</h3>`:''}<div class="crow">${gbtn(m)}</div></div>`}).join('')}
async function loadRemote(){
 loadReviews();
 if(!sbc)return;
 try{const {data}=await sbc.from('categories').select('*').order('created_at');if(data&&data.length){CATS=BASE_CATS.concat(data.map(x=>({id:x.slug,img:x.image_url,ic:'✨',ar:x.name_ar,en:x.name_en,da:x.desc_ar||'',de:x.desc_en||''})));renderCats();drawerFill();route()}}catch(e){}
 try{const {data}=await sbc.from('gallery').select('*').order('created_at',{ascending:false});if(data&&data.length){items=data;renderGal()}}catch(e){}
 try{const {data}=await sbc.from('items').select('*').order('created_at',{ascending:false});if(data&&data.length){DB=data.map(x=>({id:x.id,c:x.cat,en:x.name_en,ar:x.name_ar,b:x.before_url,a:x.after_url}));renderProducts();route()}}catch(e){}
}
async function loadStats(){
 const h=+new Date().toLocaleString('en-US',{timeZone:'Africa/Cairo',hour:'numeric',hour12:false})%24;
 $('stat').textContent=(h>=9&&h<21)?'● Online ●':'○ Offline';
 if(!sbc)return;document.querySelectorAll('.vis').forEach(e=>e.style.display='block');
 try{let n;if(sessionStorage.getItem('qc_h')){const {data}=await sbc.from('counter').select('n').eq('id',1).single();n=data.n}else{const {data}=await sbc.rpc('hit');n=data;sessionStorage.setItem('qc_h','1')}$('tot').textContent=Number(n).toLocaleString('en-US')}catch(e){}
 try{const ch=sbc.channel('online',{config:{presence:{key:Math.random().toString(36).slice(2)}}});ch.on('presence',{event:'sync'},()=>{$('onl').textContent=Object.keys(ch.presenceState()).length});ch.subscribe(async st=>{if(st==='SUBSCRIBED')await ch.track({t:Date.now()})})}catch(e){}
}
function ba(v){$('baA').style.clipPath=`inset(0 ${100-v}% 0 0)`;$('baBar').style.left=v+'%'}
function links(){['waMain','fWa'].forEach(i=>$(i).href=waLink(lang==='ar'?'مرحبًا، عايز أستفسر عن منتجاتكم':'Hello, I would like to inquire about your products'))}

/* ---- التقييمات (Supabase لو متفعّل، وإلا في المتصفح) ---- */
let RV=[];
function renderPick(){$('pick').innerHTML=[1,2,3,4,5].map(i=>`<span onclick="rate=${i};renderPick()">${i<=rate?'★':'☆'}</span>`).join('')}
async function loadReviews(){
 if(sbc){try{const {data}=await sbc.from('reviews').select('*').order('created_at',{ascending:false}).limit(60);RV=(data||[]).map(x=>({n:x.name,t:x.comment,s:x.stars,d:new Date(x.created_at).toLocaleDateString()}))}catch(e){}}
 else{try{RV=JSON.parse(localStorage.getItem('qc_reviews')||'[]')}catch(e){RV=[]}}
 renderReviews()}
async function addReview(){
 const n=$('rn').value.trim(),t=$('rt').value.trim();
 if(!n||!t||!rate){alert(lang==='ar'?'اكتب اسمك وتعليقك واختر عدد النجوم':'Please enter name, comment and stars');return}
 if(sbc){const {error}=await sbc.from('reviews').insert({name:n,stars:rate,comment:t});if(error){alert(error.message);return}await loadReviews()}
 else{RV.unshift({n,t,s:rate,d:new Date().toLocaleDateString()});try{localStorage.setItem('qc_reviews',JSON.stringify(RV))}catch(e){}renderReviews()}
 $('rn').value=$('rt').value='';rate=0;renderPick();
}
function renderReviews(){
 const r=RV;
 if(!r.length){$('avgS').textContent='☆☆☆☆☆';$('avgT').innerHTML='<b style="font-size:22px">No reviews yet - Be the first to review</b><br><span>لا توجد تقييمات بعد - كن أول من يقيّم</span>';$('rvs').innerHTML='';return}
 const avg=r.reduce((a,b)=>a+b.s,0)/r.length,k=Math.round(avg);
 $('avgS').textContent='★'.repeat(k)+'☆'.repeat(5-k);$('avgT').innerHTML=`<b style="font-size:22px">${avg.toFixed(1)} / 5</b> (${r.length})`;
 $('rvs').innerHTML=r.map(x=>`<div class="rv"><div class="stars" style="font-size:18px">${'★'.repeat(x.s)}${'☆'.repeat(5-x.s)}</div><b>${esc(x.n)}</b><p>${esc(x.t)}</p><small>${x.d}</small></div>`).join('');
}

/* ---- البوت ---- */
const QA=[{k:'catalog',ic:'📖',ar:'عرض الكتالوج',en:'View Catalog'},{k:'order',ic:'🛍️',ar:'اطلب الآن',en:'Order Now'},{k:'track',ic:'🚚',ar:'تتبع الطلب',en:'Track Order'},{k:'human',ic:'🎧',ar:'كلّم موظف',en:'Talk to Human'},{k:'prices',ic:'🏷️',ar:'الأسعار',en:'Prices'}];
let wait=null;
function toggleBot(){$('bot').classList.toggle('open')}
function openBot(){$('bot').classList.add('open')}
function say(t,w){const d=document.createElement('div');d.className='m '+w;d.textContent=t;$('msgs').appendChild(d);$('msgs').scrollTop=1e5;log.push((w==='u'?'👤 ':'🤖 ')+t)}
function sayH(h){const d=document.createElement('div');d.className='m b h';d.innerHTML=h;$('msgs').appendChild(d);$('msgs').scrollTop=1e5;log.push('🤖 '+d.textContent.trim().slice(0,160))}
function waBot(){$('bwa').href=waLink((lang==='ar'?'مرحبًا القماش كلاسيك، محادثة من الموقع:\n':'Hello Al Qamash Classic, chat from website:\n')+log.join('\n'))}
function resetBot(){
 $('msgs').innerHTML='';log=[];wait=null;
 sayH(`<b>مرحباً! أهلاً بك 🌟</b><br>${lang==='ar'?'شكراً لتواصلك مع القماش كلاسيك. كيف نقدر نساعدك؟ اختر من الأسفل:':'Welcome! Thank you for contacting Al Qamash Classic.<br>How can we assist you today? Please choose an option below:'}<div class="qa">${QA.map(a=>`<button onclick="act('${a.k}')">${a.ic} ${T(a)}</button>`).join('')}</div>`);waBot()}
function act(k){const a=QA.find(x=>x.k===k);say(T(a),'u');setTimeout(()=>{reply(k);waBot()},300)}
function thumbs(cat){const l=catalog().filter(p=>p.c===cat).slice(0,3);while(l.length<3)l.push({});return `<div class="th">${l.map(p=>{const u=p.a||p.b;return `<div ${u?`style="background-image:url('${u}')"`:''}></div>`}).join('')}</div>`}
function reply(k){
 const m=(a,e)=>lang==='ar'?a:e;
 if(k==='catalog')sayH(m('تمام! اختار القسم 👇','Of course! Choose a category 👇')+`<div class="qa">${CATS.map(c=>`<a href="#/c/${c.id}" onclick="toggleBot()">${T(c)}</a>`).join('')}</div>`);
 else if(k==='order')sayH(m('اكتب اسم المنتج والمقاس، أو كمّل مباشرة على واتساب 👇','Send the product name and size, or continue on WhatsApp 👇')+gbtn(m('عايز أطلب','I want to place an order')));
 else if(k==='track'){wait='track';say(m('اكتب رقم الطلب من فضلك 🔎','Please type your order number 🔎'),'b')}
 else if(k==='human')sayH(m('هنحوّلك لأحد فريقنا 🎧','We will connect you to our team 🎧')+gbtn(m('عايز أتكلم مع موظف','I would like to talk to a team member')));
 else if(k==='prices')sayH(m('الأسعار حسب التصميم والمقاس 💰 ابعت صورة التصميم أو المقاسات ونرد بعرض سعر فوري.','Prices depend on design and size 💰 Send the design/dimensions for a quick quote.')+gbtn(m('عايز عرض سعر','I would like a price quote')));
}
function send(){
 const v=$('bi').value.trim();if(!v)return;$('bi').value='';say(v,'u');
 if(wait){wait=null;setTimeout(()=>{sayH((lang==='ar'?'تمام، هنراجع الطلب مع الفريق 👇':'Got it, our team will check your order 👇')+gbtn((lang==='ar'?'تتبع الطلب رقم ':'Track order #')+v));waBot()},300);return}
 const q=v.toLowerCase(),hit=BOT.find(b=>b.k.some(k=>q.includes(k)));
 setTimeout(()=>{
  if(hit)sayH(esc(T(hit))+(hit.t?thumbs(hit.t)+gbtn(v):''));
  else sayH((lang==='ar'?'تمام! ابعت تفاصيل طلبك على واتساب وفريقنا هيرد فورًا 📲':'Got it! Send your details on WhatsApp and our team will reply right away 📲')+gbtn(v));
  waBot()},400);
}

setLang('ar');loadRemote();loadStats();
</script>
